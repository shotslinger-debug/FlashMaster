<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" width="412" height="892" style="background:#0F172A; border-radius: 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Sombra suave para las tarjetas -->
    <filter id="card-shadow" x="-8%" y="-4%" width="116%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="fab-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
    <!-- Clip path para el marco del celular -->
    <clipPath id="screen-clip">
      <rect x="0" y="0" width="412" height="892" rx="40" />
    </clipPath>
  </defs>

  <g clip-path="url(#screen-clip)">
    <!-- Fondo de la pantalla -->
    <rect width="412" height="892" fill="#F8FAFC" />

    <!-- Barra de estado (Status Bar) -->
    <g id="StatusBar" fill="#FFFFFF">
      <rect width="412" height="44" fill="#4F46E5" />
      <text x="32" y="28" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>
      <!-- Camara punch hole -->
      <circle cx="206" cy="22" r="10" fill="#000000" />
      <!-- Iconos de bateria y senal -->
      <path d="M345 22h-12c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2zm3-3v-6c0-.55-.45-1-1-1v8c.55 0 1-.45 1-1z" fill="#FFFFFF" opacity="0.9"/>
      <path d="M322 13a9.96 9.96 0 0 0-7.07 2.93l7.07 7.07 7.07-7.07A9.96 9.96 0 0 0 322 13z" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Top App Bar -->
    <g id="TopAppBar">
      <rect y="44" width="412" height="70" fill="#4F46E5" />
      <text x="24" y="82" font-size="22" font-weight="700" fill="#FFFFFF">FlashMaster</text>
      <text x="24" y="101" font-size="12" font-weight="500" fill="#C7D2FE">Simulador de Estudio &amp; Examen</text>
    </g>

    <!-- Fila de Chips (CategoryChipsRow) -->
    <g id="CategoryChips" transform="translate(0, 126)">
      <!-- Chip 1: Todas (Seleccionado) -->
      <rect x="16" y="0" width="70" height="34" rx="17" fill="#4F46E5" />
      <text x="51" y="22" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Todas</text>

      <!-- Chip 2: Kotlin -->
      <rect x="94" y="0" width="72" height="34" rx="17" fill="#E2E8F0" />
      <text x="130" y="22" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">Kotlin</text>

      <!-- Chip 3: Compose -->
      <rect x="174" y="0" width="88" height="34" rx="17" fill="#E2E8F0" />
      <text x="218" y="22" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">Compose</text>

      <!-- Chip 4: Arquitectura -->
      <rect x="270" y="0" width="112" height="34" rx="17" fill="#E2E8F0" />
      <text x="326" y="22" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">Arquitectura</text>
    </g>

    <!-- Tarjeta de Progreso (ProgressOverviewCard) -->
    <g id="ProgressCard" transform="translate(16, 174)" filter="url(#card-shadow)">
      <rect width="380" height="128" rx="18" fill="#FFFFFF" />

      <!-- Titulo y Porcentaje -->
      <text x="20" y="32" font-size="16" font-weight="700" fill="#1E293B">Progreso de Estudio</text>
      <text x="20" y="50" font-size="13" font-weight="600" fill="#10B981">42% dominado</text>

      <!-- Boton de reiniciar (icono refrescar) -->
      <circle cx="348" cy="34" r="16" fill="#F1F5F9" />
      <path d="M348 27c-3.87 0-7 3.13-7 7s3.13 7 7 7c3.47 0 6.36-2.54 6.89-5.85h-1.55c-.49 2.47-2.66 4.35-5.34 4.35-3.04 0-5.5-2.46-5.5-5.5s2.46-5.5 5.5-5.5c1.66 0 3.14.74 4.17 1.9l-2.67 2.6h5.5V26l-2.13 2.13C351.64 26.83 349.92 27 348 27z" fill="#4F46E5" />

      <!-- Barra de Progreso (LinearProgressIndicator) -->
      <rect x="20" y="64" width="340" height="10" rx="5" fill="#E2E8F0" />
      <rect x="20" y="64" width="142" height="10" rx="5" fill="#10B981" />

      <!-- Badges de conteo -->
      <!-- Dominadas -->
      <rect x="20" y="86" width="102" height="26" rx="6" fill="#D1FAE5" />
      <text x="71" y="103" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">5 Dominadas</text>

      <!-- En proceso -->
      <rect x="134" y="86" width="104" height="26" rx="6" fill="#FEF3C7" />
      <text x="186" y="103" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">4 En proceso</text>

      <!-- Por repasar -->
      <rect x="250" y="86" width="110" height="26" rx="6" fill="#FEE2E2" />
      <text x="305" y="103" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">3 Por repasar</text>
    </g>

    <!-- Tarjeta Principal de Estudio (FlashcardDisplayCard) -->
    <g id="FlashcardDisplay" transform="translate(16, 318)" filter="url(#card-shadow)">
      <rect width="380" height="450" rx="22" fill="#FFFFFF" />

      <!-- Cabecera de la tarjeta: Categoria, Contador y Estado -->
      <rect x="20" y="20" width="62" height="24" rx="6" fill="#EEF2FF" />
      <text x="51" y="36" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="middle">Kotlin</text>

      <text x="190" y="36" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Tarjeta 3 de 12</text>

      <rect x="286" y="20" width="74" height="24" rx="6" fill="#FEF3C7" />
      <text x="323" y="36" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">En proceso</text>

      <!-- Seccion Pregunta -->
      <text x="20" y="74" font-size="11" font-weight="700" fill="#4F46E5" letter-spacing="0.5">PREGUNTA:</text>
      <text x="20" y="102" font-size="17" font-weight="600" fill="#0F172A">¿Qué es una Data Class en Kotlin y</text>
      <text x="20" y="126" font-size="17" font-weight="600" fill="#0F172A">qué métodos genera de forma</text>
      <text x="20" y="150" font-size="17" font-weight="600" fill="#0F172A">automática?</text>

      <!-- Linea divisoria -->
      <line x1="20" y1="174" x2="360" y2="174" stroke="#F1F5F9" stroke-width="2" />

      <!-- Seccion Respuesta Revelada -->
      <text x="20" y="202" font-size="11" font-weight="700" fill="#10B981" letter-spacing="0.5">RESPUESTA:</text>
      <text x="20" y="228" font-size="14" font-weight="400" fill="#334155" line-height="20">Es una clase diseñada para contener</text>
      <text x="20" y="248" font-size="14" font-weight="400" fill="#334155">datos. El compilador le genera solo:</text>
      <text x="20" y="272" font-size="14" font-weight="600" fill="#4F46E5">toString(), equals(), hashCode(), copy()</text>
      <text x="20" y="294" font-size="14" font-weight="400" fill="#334155">y métodos componentN().</text>

      <!-- Calificacion de Dominio -->
      <text x="190" y="336" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">¿Cómo sentiste esta pregunta?</text>

      <!-- 3 Botones de Calificacion -->
      <!-- Boton Repasar -->
      <rect x="20" y="352" width="106" height="40" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" />
      <text x="73" y="377" font-size="13" font-weight="600" fill="#EF4444" text-anchor="middle">Repasar</text>

      <!-- Boton Medio -->
      <rect x="137" y="352" width="106" height="40" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
      <text x="190" y="377" font-size="13" font-weight="600" fill="#D97706" text-anchor="middle">Medio</text>

      <!-- Boton Dominada -->
      <rect x="254" y="352" width="106" height="40" rx="10" fill="#10B981" />
      <text x="307" y="377" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Dominada</text>

      <!-- Barra de navegacion inferior de la tarjeta -->
      <!-- Flecha anterior -->
      <circle cx="44" cy="420" r="18" fill="#F8FAFC" />
      <path d="M47 414l-6 6 6 6" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Etiqueta Base de estudio -->
      <text x="190" y="424" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Base de estudio</text>

      <!-- Flecha siguiente -->
      <circle cx="336" cy="420" r="18" fill="#F8FAFC" />
      <path d="M333 414l6 6-6 6" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Boton Flotante (FloatingActionButton) -->
    <g id="FAB" transform="translate(332, 788)" filter="url(#fab-shadow)">
      <rect width="56" height="56" rx="16" fill="#4F46E5" />
      <!-- Icono Mas (+) -->
      <line x1="28" y1="18" x2="28" y2="38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="18" y1="28" x2="38" y2="28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Barra de navegacion inferior del sistema Android -->
    <g id="SystemNavigation" transform="translate(0, 874)">
      <rect x="150" y="6" width="112" height="4" rx="2" fill="#94A3B8" />
    </g>
  </g>
</svg>
